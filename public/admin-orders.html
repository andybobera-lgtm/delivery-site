<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Заказы</title>
<style>
  body { font-family: sans-serif; background: #faf7f2; margin: 0; padding: 20px; }
  h1 { margin-bottom: 16px; }
  #login { max-width: 320px; margin: 80px auto; text-align: center; }
  #login input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
  #login button, .refresh-btn { padding: 10px 16px; background: #d84315; color: white; border: none; border-radius: 6px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: white; }
  th, td { border: 1px solid #e7e0d6; padding: 10px; text-align: left; font-size: 14px; vertical-align: top; }
  th { background: #f2ece2; }
  .status-paid { color: #2e7d32; font-weight: bold; }
  .status-pending { color: #a05a00; }
  .status-canceled { color: #c0392b; }
  #top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
</style>
</head>
<body>

<div id="login">
  <h1>Заказы — вход</h1>
  <input type="password" id="key" placeholder="Пароль (ADMIN_KEY)" />
  <button onclick="login()">Войти</button>
  <p id="login-error" style="color:#c0392b;"></p>
</div>

<div id="content" style="display:none;">
  <div id="top-bar">
    <h1>Заказы</h1>
    <button class="refresh-btn" onclick="loadOrders()">Обновить</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Дата</th>
        <th>Статус</th>
        <th>Сумма</th>
        <th>Покупатель</th>
        <th>Телефон</th>
        <th>Адрес</th>
        <th>Состав заказа</th>
        <th>Приборы</th>
      </tr>
    </thead>
    <tbody id="orders-body"></tbody>
  </table>
</div>

<script>
  function getKey() { return localStorage.getItem('adminKey'); }

  function login() {
    const key = document.getElementById('key').value.trim();
    if (!key) return;
    localStorage.setItem('adminKey', key);
    checkAndLoad();
  }

  function statusClass(status) {
    if (status === 'оплачен') return 'status-paid';
    if (status === 'отменён') return 'status-canceled';
    return 'status-pending';
  }

  async function loadOrders() {
    const key = getKey();
    const res = await fetch('/api/admin/orders?key=' + encodeURIComponent(key));
    if (res.status === 401) {
      localStorage.removeItem('adminKey');
      document.getElementById('login').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      document.getElementById('login-error').textContent = 'Неверный пароль';
      return;
    }
    const orders = await res.json();
    const tbody = document.getElementById('orders-body');
    tbody.innerHTML = '';
    orders.forEach((o) => {
      const itemsText = o.items.map((it) => `${it.name} × ${it.qty}`).join(', ');
      const date = new Date(o.createdAt).toLocaleString('ru-RU');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${date}</td>
        <td class="${statusClass(o.status)}">${o.status}</td>
        <td>${o.total} ₽</td>
        <td>${o.customer.name}</td>
        <td>${o.customer.phone}</td>
        <td>${o.customer.address}${o.customer.comment ? '<br><em>' + o.customer.comment + '</em>' : ''}</td>
        <td>${itemsText}</td>
        <td>${o.cutleryCount || 0}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function checkAndLoad() {
    const key = getKey();
    if (key) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      loadOrders();
    }
  }

  checkAndLoad();
</script>

</body>
</html>
