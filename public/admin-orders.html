<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Заказы — Дачная Беседка</title>
<link rel="icon" type="image/png" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Onest', sans-serif; background: #faf7f2; margin: 0; padding: 16px 20px 40px; color: #1e1e1e; }
  h1 { margin: 0; font-size: 28px; }
  button { padding: 10px 16px; background: #d84315; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-family: inherit; font-weight: 600; }
  #login { max-width: 320px; margin: 80px auto; text-align: center; }
  #login input { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }

  #top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 52px; height: 52px; object-fit: contain; }
  .brand .sub { font-size: 13px; color: #777; margin-top: 2px; }
  #sound-state { font-size: 14px; color: #555; margin-right: 8px; }
  #sound-btn.on { background: #2e7d32; }

  #alert { display: none; background: #d84315; color: #fff; padding: 16px 20px; border-radius: 10px; margin-bottom: 14px; font-size: 20px; font-weight: 700; align-items: center; justify-content: space-between; gap: 12px; animation: blink 1s infinite; }
  #alert button { background: #fff; color: #d84315; }
  @keyframes blink { 50% { opacity: .78; } }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { background: #fff; color: #444; border: 1px solid #e7e0d6; padding: 10px 18px; border-radius: 10px; }
  .tab.active { background: #1e1e1e; color: #fff; border-color: #1e1e1e; }
  .tab .cnt { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 6px; border-radius: 11px; background: #eee; color: #333; font-size: 13px; text-align: center; }
  .tab.active .cnt { background: #fff; color: #1e1e1e; }
  .tab.hot .cnt { background: #d84315; color: #fff; }

  table { width: 100%; border-collapse: collapse; background: white; }
  th, td { border: 1px solid #e7e0d6; padding: 10px; text-align: left; font-size: 14px; vertical-align: top; }
  th { background: #f2ece2; }
  tr.waiting td { background: #fff3cd; }
  .empty { background: #fff; border: 1px solid #e7e0d6; padding: 30px; text-align: center; color: #888; border-radius: 10px; }
  .status-paid { color: #2e7d32; font-weight: bold; }
  .status-pending { color: #a05a00; }
  .status-canceled { color: #c0392b; }
  .status-work { color: #1565c0; font-weight: bold; }
  .wait { font-size: 12px; color: #c0392b; font-weight: 600; margin-top: 4px; }
  .act { min-width: 190px; }
  .act select { padding: 8px; font-size: 14px; margin-bottom: 6px; width: 100%; }
  .act button { width: 100%; white-space: nowrap; }
  .act button.green { background: #2e7d32; }
  .act .eta { font-size: 12px; color: #555; margin-bottom: 4px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>

<div id="login">
  <img src="images/logo.png" alt="" style="width:80px;height:80px;object-fit:contain;" />
  <h1>Заказы — вход</h1>
  <input type="password" id="key" placeholder="Пароль (ADMIN_KEY)" />
  <button onclick="login()">Войти</button>
  <p id="login-error" style="color:#c0392b;"></p>
</div>

<div id="start" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(21,47,36,.92);color:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;">
  <img src="images/logo.png" alt="" style="width:96px;height:96px;object-fit:contain;margin-bottom:16px;" />
  <div style="font-size:26px;font-weight:700;margin-bottom:8px;">Приём заказов</div>
  <div style="font-size:16px;opacity:.85;margin-bottom:22px;max-width:360px;">Нажмите один раз — после этого звук включён, и каждый новый заказ будет звонить сам</div>
  <button onclick="enableSound(true)" style="font-size:20px;padding:16px 34px;background:#d84315;">▶ Начать приём заказов</button>
</div>

<div id="content" style="display:none;">
  <div id="top-bar">
    <div class="brand">
      <img src="images/logo.png" alt="Логотип" />
      <div><h1>Заказы</h1><div class="sub">Дачная Беседка</div></div>
    </div>
    <div>
      <span id="sound-state">🔇 Звук выключен</span>
      <button id="sound-btn" onclick="toggleSound()">Включить звук</button>
    </div>
  </div>

  <div id="alert">
    <span id="alert-text">🔔 Новый заказ — примите его!</span>
    <button id="alert-sound" onclick="toggleSound()" style="display:none;">Включить звук</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<script>
  const REFRESH_MS = 5000;   // как часто проверять новые заказы
  const RING_EVERY_MS = 7000; // звонок повторяется, пока есть непринятые заказы

  const TABS = [
    { id: 'new',  title: 'Новые',        hint: 'ждут принятия',   match: (o) => o.status === 'оплачен' },
    { id: 'work', title: 'В работе',     hint: '',                match: (o) => ['принят', 'готов', 'передан курьеру'].includes(o.status) },
    { id: 'done', title: 'Завершённые',  hint: '',                match: (o) => ['доставлен', 'отменён'].includes(o.status) },
    { id: 'all',  title: 'Все заказы',   hint: '',                match: () => true },
  ];

  let orders = [];
  let currentTab = 'new';
  let soundOn = false;
  let audioCtx = null, master = null;
  let ringTimer = null;
  let waitingCount = 0;
  let wakeLock = null;

  function getKey() { return localStorage.getItem('adminKey'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function login() {
    const key = document.getElementById('key').value.trim();
    if (!key) return;
    localStorage.setItem('adminKey', key);
    checkAndLoad();
  }
  function statusClass(status) {
    if (status === 'оплачен') return 'status-paid';
    if (status === 'отменён') return 'status-canceled';
    if (['принят', 'готов', 'передан курьеру'].includes(status)) return 'status-work';
    if (status === 'доставлен') return 'status-paid';
    return 'status-pending';
  }

  // ---------- Звук: кассовый аппарат «Ча-чинг!» + голос «Пришёл заказ», пока заказ не принят ----------
  function noiseClick(t0, dur, vol, freq) {
    // короткий механический «клац» кассы
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.1;
    const g = audioCtx.createGain();
    g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0);
  }
  function ping(freq, t0, dur, vol) {
    // металлический «дзинь» — основной тон и обертоны, как у монеты и звонка кассы
    [[1, 1], [2.76, 0.5], [5.4, 0.25], [8.9, 0.1]].forEach(([mult, amp]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq * mult;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol * amp, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0);
      o.stop(t0 + dur + 0.05);
    });
  }
  function chaChing() {
    const t = audioCtx.currentTime + 0.05;
    noiseClick(t, 0.07, 0.9, 1800);          // «ча»
    noiseClick(t + 0.1, 0.05, 0.6, 3200);
    ping(2093, t + 0.14, 1.5, 0.7);          // «чинг!» — звонок кассы
    ping(3136, t + 0.30, 0.6, 0.45);         // двойной звон монет
    ping(3951, t + 0.40, 0.6, 0.4);
    ping(3136, t + 0.52, 0.7, 0.35);
  }
  function speakOrder() {
    if (!('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance('Пришёл заказ');
      u.lang = 'ru-RU';
      u.volume = 1;
      u.rate = 0.95;
      const v = speechSynthesis.getVoices().find((x) => /^ru/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function ring() {
    if (!soundOn || !audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    chaChing();
    setTimeout(() => { if (soundOn) speakOrder(); }, 1500);
  }
  function updateRinging() {
    const need = soundOn && waitingCount > 0;
    if (need && !ringTimer) {
      ring();
      ringTimer = setInterval(() => { if (soundOn && waitingCount > 0) ring(); }, RING_EVERY_MS);
    } else if (!need && ringTimer) {
      clearInterval(ringTimer); ringTimer = null;
      try { speechSynthesis.cancel(); } catch (e) {}
    }
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && soundOn) keepAwake();
  });

  let userMuted = false;
  function enableSound(withTest) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = audioCtx.createDynamicsCompressor();
      master = audioCtx.createGain();
      master.gain.value = 1.0;
      master.connect(comp); comp.connect(audioCtx.destination);
    }
    audioCtx.resume();
    soundOn = true;
    userMuted = false;
    keepAwake();
    try { speechSynthesis.getVoices(); } catch (e) {}
    document.getElementById('start').style.display = 'none';
    if (withTest && waitingCount === 0) { chaChing(); setTimeout(speakOrder, 1500); } // пробный сигнал — проверить громкость
    renderTop();
    updateRinging();
  }
  function toggleSound() {
    if (!soundOn) { enableSound(true); return; }
    soundOn = false;
    userMuted = true;
    renderTop();
    updateRinging();
  }
  // Браузер разрешает звук только после клика. Любое первое нажатие на странице включает звук само.
  ['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, () => {
    if (!soundOn && !userMuted && getKey()) enableSound(false);
  }, { once: false }));

  function renderTop() {
    document.getElementById('sound-state').textContent = soundOn ? '🔊 Звук включён' : '🔇 Звук выключен';
    const b = document.getElementById('sound-btn');
    b.textContent = soundOn ? 'Выключить звук' : 'Включить звук';
    b.className = soundOn ? 'on' : '';

    const al = document.getElementById('alert');
    al.style.display = waitingCount > 0 ? 'flex' : 'none';
    document.getElementById('alert-text').textContent =
      waitingCount > 1 ? `🔔 Новых заказов: ${waitingCount} — примите их!` : '🔔 Новый заказ — примите его!';
    document.getElementById('alert-sound').style.display = soundOn ? 'none' : 'inline-block';
    document.title = waitingCount > 0 ? `(${waitingCount}) НОВЫЙ ЗАКАЗ — Дачная Беседка` : 'Заказы — Дачная Беседка';
  }

  // ---------- Кнопки смены статуса ----------
  function actionHtml(o) {
    const id = esc(o.id);
    if (o.status === 'оплачен') {
      return `<select id="prep-${id}">
          <option value="20">Готовим 20 мин</option>
          <option value="30" selected>Готовим 30 мин</option>
          <option value="40">Готовим 40 мин</option>
          <option value="60">Готовим 60 мин</option>
        </select>
        <button class="green" onclick="setStatus('${id}','принят')">✅ Принять заказ</button>`;
    }
    if (o.status === 'принят') {
      const eta = o.readyEta ? new Date(o.readyEta).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
      return `<div class="eta">Готовим${eta ? ' до ' + eta : ''}</div>
        <button onclick="setStatus('${id}','готов')">🍳 Заказ готов</button>`;
    }
    if (o.status === 'готов') {
      return `<div class="eta">Заказ готов, ищем курьера</div>
        <select id="deliv-${id}">
          <option value="10">Курьер довезёт ~10 мин</option>
          <option value="15">~15 мин</option>
          <option value="20" selected>~20 мин</option>
          <option value="30">~30 мин</option>
          <option value="40">~40 мин</option>
        </select>
        <button onclick="setStatus('${id}','передан курьеру')">🛵 Передан курьеру</button>`;
    }
    if (o.status === 'передан курьеру') return `<button class="green" onclick="setStatus('${id}','доставлен')">📦 Доставлен</button>`;
    return '';
  }

  async function setStatus(id, status) {
    const body = { status };
    const sel = document.getElementById('prep-' + id);
    if (sel) body.prepMinutes = Number(sel.value);
    const dsel = document.getElementById('deliv-' + id);
    if (dsel) body.deliveryMinutes = Number(dsel.value);
    const res = await fetch('/api/admin/orders/' + encodeURIComponent(id) + '/status?key=' + encodeURIComponent(getKey()), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      alert(d.error || 'Не удалось сменить статус');
    }
    await loadOrders();
  }

  // ---------- Вкладки и таблица ----------
  function renderTabs() {
    const box = document.getElementById('tabs');
    box.innerHTML = TABS.map((t) => {
      const n = orders.filter(t.match).length;
      const hot = t.id === 'new' && n > 0 ? ' hot' : '';
      return `<button class="tab${currentTab === t.id ? ' active' : ''}${hot}" onclick="selectTab('${t.id}')">${t.title}<span class="cnt">${n}</span></button>`;
    }).join('');
  }
  function selectTab(id) { currentTab = id; renderAll(); }

  function waitText(o) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(o.paidAt || o.createdAt).getTime()) / 60000));
    return `ждёт принятия ${mins} мин`;
  }

  function renderList() {
    const tab = TABS.find((t) => t.id === currentTab);
    const rows = orders.filter(tab.match);
    const box = document.getElementById('list');
    if (!rows.length) {
      box.innerHTML = `<div class="empty">${currentTab === 'new' ? 'Новых заказов нет' : 'Здесь пока пусто'}</div>`;
      return;
    }
    // чтобы не сбрасывались выбранные «минуты» при автообновлении
    const prevSel = {};
    document.querySelectorAll('select[id^="prep-"], select[id^="deliv-"]').forEach((x) => { prevSel[x.id] = x.value; });

    box.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>№</th><th>Дата</th><th>Статус</th><th>Сумма</th><th>Покупатель</th><th>Телефон</th><th>Адрес</th><th>Состав заказа</th><th>Приборы</th><th>Действие</th></tr></thead>
      <tbody>${rows.map((o) => {
        const c = o.customer || {};
        const itemsText = (o.items || []).map((it) => `${esc(it.name)} × ${esc(it.qty)}`).join(', ');
        const date = new Date(o.createdAt).toLocaleString('ru-RU');
        return `<tr class="${o.status === 'оплачен' ? 'waiting' : ''}">
          <td>${esc(String(o.id).slice(0, 8))}</td>
          <td>${date}</td>
          <td class="${statusClass(o.status)}">${esc(o.status)}${o.status === 'оплачен' ? `<div class="wait">${waitText(o)}</div>` : ''}</td>
          <td>${esc(o.total)} ₽</td>
          <td>${esc(c.name)}</td>
          <td>${esc(c.phone)}</td>
          <td>${esc(c.address)}${c.comment ? '<br><em>' + esc(c.comment) + '</em>' : ''}</td>
          <td>${itemsText}</td>
          <td>${esc(o.cutleryCount || 0)}</td>
          <td class="act">${actionHtml(o)}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
    Object.keys(prevSel).forEach((id) => { const x = document.getElementById(id); if (x) x.value = prevSel[id]; });
  }

  function renderAll() {
    waitingCount = orders.filter((o) => o.status === 'оплачен').length;
    renderTop();
    renderTabs();
    renderList();
    updateRinging();
  }

  async function loadOrders() {
    let res;
    try { res = await fetch('/api/admin/orders?key=' + encodeURIComponent(getKey()), { cache: 'no-store' }); }
    catch (e) { return; } // нет интернета — попробуем в следующий раз
    if (res.status === 401) {
      localStorage.removeItem('adminKey');
      document.getElementById('login').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      document.getElementById('login-error').textContent = 'Неверный пароль';
      return;
    }
    if (!res.ok) return;
    const fresh = await res.json();
    // если появился новый заказ, а открыта другая вкладка — переключаемся на «Новые»
    const hadWaiting = orders.some((o) => o.status === 'оплачен');
    orders = fresh;
    if (!hadWaiting && orders.some((o) => o.status === 'оплачен')) currentTab = 'new';
    renderAll();
  }

  function checkAndLoad() {
    if (getKey()) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      if (!soundOn) document.getElementById('start').style.display = 'flex';
      renderTop();
      loadOrders();
      setInterval(loadOrders, REFRESH_MS);
    }
  }

  checkAndLoad();
</script>

</body>
</html>
