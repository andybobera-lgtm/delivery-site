<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Заказы — Дачная Беседка</title>
<style>
  body { font-family: sans-serif; background: #faf7f2; margin: 0; padding: 20px; }
  h1 { margin: 0; }
  #login { max-width: 320px; margin: 80px auto; text-align: center; }
  #login input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
  button { padding: 10px 16px; background: #d84315; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; background: white; }
  th, td { border: 1px solid #e7e0d6; padding: 10px; text-align: left; font-size: 14px; vertical-align: top; }
  th { background: #f2ece2; }
  tr.new-order td { background: #fff3cd; }
  .status-paid { color: #2e7d32; font-weight: bold; }
  .status-pending { color: #a05a00; }
  .status-canceled { color: #c0392b; }
  #top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .act select { padding: 8px; font-size: 14px; margin-bottom: 6px; width: 100%; box-sizing: border-box; }
  .act button { width: 100%; white-space: nowrap; }
  .act button.green { background: #2e7d32; }
  .act .eta { font-size: 12px; color: #555; margin-bottom: 4px; }
  .status-work { color: #1565c0; font-weight: bold; }
  #sound-state { font-size: 14px; color: #555; }
  #sound-btn.on { background: #2e7d32; }
  #alert { display: none; background: #d84315; color: #fff; padding: 18px 20px; border-radius: 8px; margin-bottom: 16px; font-size: 20px; font-weight: bold; align-items: center; justify-content: space-between; gap: 12px; animation: blink 1s infinite; }
  #alert button { background: #fff; color: #d84315; font-weight: bold; }
  @keyframes blink { 50% { opacity: .75; } }
</style>
</head>
<body>

<div id="login">
  <h1>Заказы — вход</h1>
  <input type="password" id="key" placeholder="Пароль (ADMIN_KEY)" />
  <button onclick="login()">Войти</button>
  <p id="login-error" style="color:#c0392b;"></p>
</div>

<div id="content" style="display:none;">
  <div id="top-bar">
    <h1>Заказы</h1>
    <div>
      <span id="sound-state">🔇 Звук выключен</span>
      <button id="sound-btn" onclick="toggleSound()">Включить звук</button>
    </div>
  </div>
  <div id="alert">
    <span id="alert-text">🔔 Новый оплаченный заказ!</span>
    <button onclick="ackAlert()">Принято</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>№</th><th>Дата</th><th>Статус</th><th>Сумма</th><th>Покупатель</th>
        <th>Телефон</th><th>Адрес</th><th>Состав заказа</th><th>Приборы</th><th>Действие</th>
      </tr>
    </thead>
    <tbody id="orders-body"></tbody>
  </table>
</div>

<script>
  const REFRESH_MS = 10000;   // как часто проверять новые заказы
  const REPEAT_MS = 6000;     // как часто повторять сигнал, пока не нажата «Принято»

  let soundOn = false;
  let audioCtx = null;
  let seenPaid = null;        // id оплаченных заказов, о которых уже знаем
  let pendingNew = 0;         // сколько новых оплаченных ждут нажатия «Принято»
  let repeatTimer = null;
  let wakeLock = null;

  function getKey() { return localStorage.getItem('adminKey'); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function login() {
    const key = document.getElementById('key').value.trim();
    if (!key) return;
    localStorage.setItem('adminKey', key);
    checkAndLoad();
  }

  function statusClass(status) {
    if (status === 'оплачен') return 'status-paid';
    if (status === 'отменён') return 'status-canceled';
    if (['принят', 'готов', 'передан курьеру'].includes(status)) return 'status-work';
    if (status === 'доставлен') return 'status-paid';
    return 'status-pending';
  }

  // ---------- Звук ----------
  function beep(freq, start, dur) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime + start);
    g.gain.exponentialRampToValueAtTime(0.8, audioCtx.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + start);
    o.stop(audioCtx.currentTime + start + dur + 0.05);
  }
  function playSignal() {
    if (!soundOn || !audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // «Дин-дон-дин-дон» — громкая мелодия звонка
    [[880, 0], [660, 0.35], [880, 0.7], [660, 1.05]].forEach(([f, t]) => beep(f, t, 0.3));
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && soundOn) keepAwake();
  });

  function toggleSound() {
    if (!soundOn) {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
      soundOn = true;
      keepAwake();
      playSignal(); // пробный сигнал — чтобы проверить громкость
    } else {
      soundOn = false;
    }
    renderSoundState();
  }
  function renderSoundState() {
    document.getElementById('sound-state').textContent = soundOn ? '🔊 Звук включён' : '🔇 Звук выключен — нажмите кнопку';
    const b = document.getElementById('sound-btn');
    b.textContent = soundOn ? 'Выключить звук' : 'Включить звук';
    b.className = soundOn ? 'on' : '';
  }

  function showAlert() {
    const el = document.getElementById('alert');
    document.getElementById('alert-text').textContent =
      pendingNew > 1 ? `🔔 Новых оплаченных заказов: ${pendingNew}` : '🔔 Новый оплаченный заказ!';
    el.style.display = pendingNew > 0 ? 'flex' : 'none';
    document.title = pendingNew > 0 ? `(${pendingNew}) НОВЫЙ ЗАКАЗ!` : 'Заказы — Дачная Беседка';
  }
  function ackAlert() {
    pendingNew = 0;
    clearInterval(repeatTimer); repeatTimer = null;
    showAlert();
    document.querySelectorAll('tr.new-order').forEach((r) => r.classList.remove('new-order'));
  }
  function startRepeat() {
    if (repeatTimer) return;
    repeatTimer = setInterval(() => { if (pendingNew > 0) playSignal(); }, REPEAT_MS);
  }

  // ---------- Кнопки смены статуса ----------
  function actionHtml(o) {
    const id = esc(o.id);
    if (o.status === 'оплачен') {
      return `<select id="prep-${id}">
          <option value="20">Готовим 20 мин</option>
          <option value="30" selected>Готовим 30 мин</option>
          <option value="40">Готовим 40 мин</option>
          <option value="60">Готовим 60 мин</option>
        </select>
        <button class="green" onclick="setStatus('${id}','принят')">✅ Принять заказ</button>`;
    }
    if (o.status === 'принят') {
      const eta = o.readyEta ? new Date(o.readyEta).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
      return `<div class="eta">Готовим${eta ? ' до ' + eta : ''}</div>
        <button onclick="setStatus('${id}','готов')">🍳 Заказ готов</button>`;
    }
    if (o.status === 'готов') {
      return `<div class="eta">Заказ готов, ищем курьера</div>
        <select id="deliv-${id}">
          <option value="10">Курьер довезёт ~10 мин</option>
          <option value="15">~15 мин</option>
          <option value="20" selected>~20 мин</option>
          <option value="30">~30 мин</option>
          <option value="40">~40 мин</option>
        </select>
        <button onclick="setStatus('${id}','передан курьеру')">🛵 Передан курьеру</button>`;
    }
    if (o.status === 'передан курьеру') return `<button class="green" onclick="setStatus('${id}','доставлен')">📦 Доставлен</button>`;
    return '';
  }

  async function setStatus(id, status) {
    const body = { status };
    const sel = document.getElementById('prep-' + id);
    if (sel) body.prepMinutes = Number(sel.value);
    const dsel = document.getElementById('deliv-' + id);
    if (dsel) body.deliveryMinutes = Number(dsel.value);
    const res = await fetch('/api/admin/orders/' + encodeURIComponent(id) + '/status?key=' + encodeURIComponent(getKey()), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      alert(d.error || 'Не удалось сменить статус');
    }
    if (status === 'принят') ackAlert();
    loadOrders();
  }

  // ---------- Заказы ----------
  async function loadOrders() {
    const key = getKey();
    let res;
    try { res = await fetch('/api/admin/orders?key=' + encodeURIComponent(key)); }
    catch (e) { return; } // нет интернета — попробуем в следующий раз
    if (res.status === 401) {
      localStorage.removeItem('adminKey');
      document.getElementById('login').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      document.getElementById('login-error').textContent = 'Неверный пароль';
      return;
    }
    if (!res.ok) return;
    const orders = await res.json();

    // Новые оплаченные заказы (при первой загрузке страницы всё старое считаем «уже виденным»)
    const paidIds = orders.filter((o) => o.status === 'оплачен').map((o) => o.id);
    const freshIds = new Set();
    if (seenPaid === null) {
      seenPaid = new Set(paidIds);
    } else {
      paidIds.forEach((id) => { if (!seenPaid.has(id)) { seenPaid.add(id); freshIds.add(id); } });
      if (freshIds.size) {
        pendingNew += freshIds.size;
        showAlert();
        playSignal();
        startRepeat();
      }
    }

    const prevSel = {};
    document.querySelectorAll('select[id^="prep-"], select[id^="deliv-"]').forEach((x) => { prevSel[x.id] = x.value; });
    const tbody = document.getElementById('orders-body');
    tbody.innerHTML = '';
    orders.forEach((o) => {
      const itemsText = (o.items || []).map((it) => `${esc(it.name)} × ${esc(it.qty)}`).join(', ');
      const date = new Date(o.createdAt).toLocaleString('ru-RU');
      const c = o.customer || {};
      const tr = document.createElement('tr');
      if (freshIds.has(o.id)) tr.classList.add('new-order');
      tr.dataset.id = o.id;
      tr.innerHTML = `
        <td>${esc(String(o.id).slice(0, 8))}</td>
        <td>${date}</td>
        <td class="${statusClass(o.status)}">${esc(o.status)}</td>
        <td>${esc(o.total)} ₽</td>
        <td>${esc(c.name)}</td>
        <td>${esc(c.phone)}</td>
        <td>${esc(c.address)}${c.comment ? '<br><em>' + esc(c.comment) + '</em>' : ''}</td>
        <td>${itemsText}</td>
        <td>${esc(o.cutleryCount || 0)}</td>
        <td class="act">${actionHtml(o)}</td>
      `;
      tbody.appendChild(tr);
    });
    Object.keys(prevSel).forEach((id) => { const x = document.getElementById(id); if (x) x.value = prevSel[id]; });
  }

  function checkAndLoad() {
    if (getKey()) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      renderSoundState();
      loadOrders();
      setInterval(loadOrders, REFRESH_MS);
    }
  }

  checkAndLoad();
</script>

</body>
</html>
