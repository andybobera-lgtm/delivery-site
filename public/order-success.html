<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Спасибо за заказ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main style="max-width:520px;margin:80px auto;text-align:center;padding:0 20px;">
    <h1 style="font-size:32px;margin-bottom:12px;">Спасибо за заказ!</h1>
    <p id="status" style="font-size:16px;color:var(--muted);">Проверяем статус оплаты...</p>
    <p style="color:var(--muted);">Мы свяжемся с вами по указанному телефону, чтобы уточнить детали доставки.</p>
    <a href="/" style="color:var(--accent);font-weight:600;">Вернуться на главную</a>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    const statusEl = document.getElementById('status');

    if (orderId) {
      fetch('/api/orders/' + orderId)
        .then((r) => r.json())
        .then((data) => {
          if (data.status === 'оплачен') {
            statusEl.textContent = 'Оплата подтверждена. Заказ №' + orderId.slice(0, 8);
          } else {
            statusEl.textContent = 'Статус заказа: ' + (data.status || 'обрабатывается');
          }
        })
        .catch(() => {
          statusEl.textContent = 'Не удалось проверить статус, но заказ сохранён.';
        });
    }
  </script>
</body>
</html>
